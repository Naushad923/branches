name: OIDC
on:
  push:
    branches:
    - feature
  workflow_dispatch:

permissions:
  id-token: write
  contents: read    

jobs:
  Terraform_Plan:
    name: Terrafrom Plan
    if: github.ref == 'refs/heads/feature'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # - uses: hashicorp/setup-terraform@v4
      #   with:
      #    terraform_version: "1.14.6"  
    
      - uses: azure/login@v3
        name: Azure login

        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  
          
      - name: init
        run: terraform init
      - name: pla
        run: terraform plan    

  Terraform_Apply:
    name: Terrafrom Apply
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # - uses: hashicorp/setup-terraform@v4
      #   with:
      #    terraform_version: "1.14.6"  
    
      - uses: azure/login@v3
        name: Azure login

        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  
          
      - name: init
        run: terraform init
      - name: pla
        run: terraform plan
      - name: apply
        run: terraform apply            
