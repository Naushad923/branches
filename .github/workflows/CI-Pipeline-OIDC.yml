name: OIDC
on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read    

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # - uses: hashicorp/setup-terraform@v4
      #   with:
      #    terraform_version: "1.14.6"  
    
      - uses: azure/login@v3
        name: Azure login

        with: 
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  
          
      - name: init
        run: terraform init
      - name: pla
        run: terraform plan     

