name: OIDC
on:
  push:
    branches:
      - feature
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  Terraform_Plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/feature'
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - uses: azure/login@v3
        name: Azure Login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan



  Terraform_Apply:
    name: Terraform Apply
    needs: Terraform_Apply
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:

      - uses: actions/checkout@v4

      - uses: azure/login@v3
        name: Azure Login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve